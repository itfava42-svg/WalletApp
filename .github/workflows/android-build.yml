name: WalletApp Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'ci/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci-22:
    name: CI-22 — UI Standardization
    runs-on: ubuntu-latest

    steps:
      - name: CI-22 — Checkout
        uses: actions/checkout@v4

      - name: CI-22 — Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: CI-22 — Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: CI-22 — Verify Loan UI label
        shell: bash
        run: |
          set -e
          FILE="app/src/main/java/com/example/walletapp/ui/screens/LoanManagementScreen.kt"
          test -f "$FILE"
          grep -F 'فاصله اقساط' "$FILE"
          grep -F 'نوع وام' "$FILE"
          grep -F 'قسط ماهیانه' "$FILE"
          grep -F 'MatureColors.Success.copy(alpha = 0.10f)' "$FILE"
          echo "PASS: CI-22 loan UI markers"

      - name: CI-22 — Make Gradle executable
        run: chmod +x ./gradlew

      - name: CI-22 — Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: CI-22 — Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: CI-22 — COMPLETE
        run: echo "WALLETAPP ci-16l COMPLETE — ALL CHECKS PASSED"
