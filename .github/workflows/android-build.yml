name: WalletApp Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'ci/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci-16l:
    name: ci-16l — Loan Editor Interval UI Repair
    runs-on: ubuntu-latest

    steps:
      - name: ci-16l — Checkout
        uses: actions/checkout@v4

      - name: ci-16l — Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: ci-16l — Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: ci-16l — Verify Loan UI label
        shell: bash
        run: |
          set -e
          FILE="app/src/main/java/com/example/walletapp/ui/screens/LoanManagementScreen.kt"
          test -f "$FILE"
          grep -F 'label = { Text("فاصله اقساط") }' "$FILE"
          grep -F 'label = { Text("نوع وام") }' "$FILE"
          grep -F 'text = "قسط ماهیانه"' "$FILE"
          grep -F 'color = MatureColors.Success.copy(alpha = 0.10f)' "$FILE"
          echo "PASS: loan editor layout/contrast markers"

      - name: ci-16l — Make Gradle executable
        run: chmod +x ./gradlew

      - name: ci-16l — Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: ci-16l — Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: ci-16l — COMPLETE
        run: echo "WALLETAPP ci-16l COMPLETE — ALL CHECKS PASSED"
