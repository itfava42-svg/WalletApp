name: WalletApp Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'ci/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci-16k:
    name: CI-16K — Loan Editor Interval UI Repair
    runs-on: ubuntu-latest

    steps:
      - name: CI-16K — Checkout
        uses: actions/checkout@v4

      - name: CI-16K — Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: CI-16K — Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: CI-16K — Verify Loan UI label
        shell: bash
        run: |
          set -e
          FILE="app/src/main/java/com/example/walletapp/ui/screens/LoanManagementScreen.kt"
          test -f "$FILE"
          grep -F 'label = { Text("فاصله اقساط") }' "$FILE"
          echo "PASS: فاصله اقساط"

      - name: CI-16K — Make Gradle executable
        run: chmod +x ./gradlew

      - name: CI-16K — Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: CI-16K — Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: CI-16K — COMPLETE
        run: echo "WALLETAPP CI-16K COMPLETE — ALL CHECKS PASSED"
